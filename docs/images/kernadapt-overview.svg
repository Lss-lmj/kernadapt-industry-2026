<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">KernAdapt</title>
<desc id="desc">Adaptive Linux resource control. Application dependencies inform configuration decisions and kernel scheduling.</desc>
